<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tarte à beauté</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <script defer src="assets/js/pages/checkout.js" type="module"></script>
  </head>

  <body class="checkout">
    <header class="checkout">
      <div class="logo">
        <h1>Tarte à beauté</h1>
        <img src="assets/images/logo.png" alt="logo" width="100" height="90" />
      </div>
      <a href="./cart.html">
        <button id="cartBtn" class="cartBtn">
          Mon panier <i class="fa-solid fa-cart-shopping"></i>
        </button>
      </a>
    </header>

    <main class="checkout">
      <section class="step step-1 active">
        <h2>Coordonnées</h2>
        <form class="coordinates-form">
          <div class="form-row">
            <input
              type="text"
              id="lastname"
              name="lastname"
              placeholder="Nom"
              aria-label="Nom"
              pattern="^[a-zA-ZÀ-ÿ\s\-']{2,50}$"
              title="Le nom doit contenir uniquement des lettres, espaces, tirets et apostrophes (2-50 caractères)"
            />
            <input
              type="text"
              id="firstname"
              name="firstname"
              placeholder="Prénom"
              aria-label="Prénom"
              pattern="^[a-zA-ZÀ-ÿ\s\-']{2,50}$"
              title="Le prénom doit contenir uniquement des lettres, espaces, tirets et apostrophes (2-50 caractères)"
            />
          </div>

          <div class="form-row">
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Email"
              aria-label="Adresse email"
            />
          </div>

          <div class="form-row">
            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="Numéro de téléphone"
              aria-label="Numéro de téléphone"
              pattern="^(?:(?:\+33|0)[1-9](?:[0-9]{8}))$"
              title="Format accepté: 0123456789 ou +33123456789"
            />
          </div>

          <div class="form-row">
            <input
              type="text"
              id="address"
              name="address"
              placeholder="Adresse"
              aria-label="Adresse complète"
            />
          </div>

          <div class="form-row">
            <input
              type="text"
              id="city"
              name="city"
              placeholder="Ville"
              aria-label="Ville"
              pattern="^[a-zA-ZÀ-ÿ\s\-']{2,100}$"
              title="La ville doit contenir uniquement des lettres, espaces, tirets et apostrophes (2-100 caractères)"
            />
            <input
              type="text"
              id="zipcode"
              name="zipcode"
              placeholder="Code postal"
              aria-label="Code postal"
              pattern="^(?:0[1-9]|[1-8][0-9]|9[0-8])[0-9]{3}$"
              title="Code postal français valide (ex: 75001, 13000)"
              maxlength="5"
            />
          </div>

          <input type="submit" class="continue-btn" value="Continuer" />
        </form>
      </section>
      <section class="step step-2">
        <h2>Paiement</h2>
        <form class="payment-form">
          <div class="form-row">
            <input
              type="text"
              id="card-number"
              name="card-number"
              placeholder="Numéro de carte"
              aria-label="Numéro de carte"
              pattern="^[0-9]{13,19}$"
              title="Numéro de carte valide (13-19 chiffres)"
              maxlength="19"
            />

            <input
              type="text"
              id="card-holder"
              name="card-holder"
              placeholder="Nom du titulaire"
              aria-label="Nom du titulaire"
              pattern="^[a-zA-ZÀ-ÿ\s\-']{2,50}$"
              title="Nom comme sur la carte (lettres, espaces, tirets, apostrophes)"
            />
          </div>
          <div class="form-row">
            <input
              type="text"
              id="expiration-date"
              name="expiration-date"
              placeholder="MM/AA"
              aria-label="Date d'expiration"
              pattern="^(0[1-9]|1[0-2])\/([0-9]{2})$"
              title="Format MM/AA (ex: 12/25)"
              maxlength="5"
            />

            <input
              type="text"
              id="cvv"
              name="cvv"
              placeholder="CVV"
              aria-label="CVV"
              pattern="^[0-9]{3,4}$"
              title="Code CVV à 3 ou 4 chiffres"
              maxlength="4"
            />
          </div>

          <div class="terms-and-conditions">
            <label for="terms-and-conditions"
              >J'accepte les
              <a href="cgv.html">conditions générales de vente</a></label
            >
            <input
              type="checkbox"
              name="terms-and-conditions"
              id="terms-and-conditions"
            />
          </div>

          <h4 class="subtotal">Sous-total : 0€</h4>
          <p class="delivery-fee">Frais de livraison : 0€</p>
          <h3 class="total">Total : 0€</h3>

          <div class="form-actions">
            <button class="back-btn">Retour</button>
            <input type="submit" class="validate-btn" value="Valider" />
          </div>
        </form>
      </section>
    </main>

    <footer>
      <div class="footer-container">
        <div class="footer-links">
          <a href="mentions-legales.html">Mentions légales</a>
          <a href="politique-confidentialite.html"
            >Politique de confidentialité</a
          >
          <a href="cgu.html">CGU</a>
          <a href="cgv.html">CGV</a>
        </div>
        <p>© 2025 Tarte à beauté. Tous droits réservés.</p>
      </div>
    </footer>
  </body>
  <template id="succes-template">
    <section class="succes">
      <div class="title-succes">
        <h2 class="h2-succes">Merci pour votre comande</h2>
      </div>
      <i class="fa-solid fa-check-circle" id="icone-succes"></i>
      <div class="div-succes">
        <p class="p-succes">Numero de commande :</p>
        <p class="p-succes">Adresse de livraison :</p>
        <p class="p-succes">Total de votre commande :</p>
        <p class="p-succes">Email :</p>
        <p class="p-succes">Numero de téléphone :</p>
        <button class="btn-succes">
          <a href="index.html">Revenir a la page d'accueil</a>
        </button>
      </div>
    </section>
  </template>
</html>
